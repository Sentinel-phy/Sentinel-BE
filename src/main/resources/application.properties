# Sentinel Server Configuration
server.port=8090

# CORS
cors.origin=http://localhost:5174

# GPU Pool
gpu.max.slots=10

# Metering
metering.interval.sec=30

# Session
session.max.hours=8

# Billing (KRW)
billing.base.monthly.krw=30000
billing.hourly.rate.krw=3000
billing.base.included.hours=5

# Sim2Real Monitoring
monitoring.drift.threshold=5.0

# Database (PostgreSQL) - PoC uses in-memory store
db.url=jdbc:postgresql://localhost:5432/sentinel
db.user=sentinel
db.password=sentinel

# Redis - PoC uses in-memory store
redis.host=localhost
redis.port=6379
